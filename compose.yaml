# Local PostgreSQL for development.
#   start: docker compose up -d
#   stop:  docker compose down        (add -v to also delete the data)
# Same credentials as the defaults in backend/src/main/resources/application.properties.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lebuzzer
      POSTGRES_USER: lebuzzer
      POSTGRES_PASSWORD: lebuzzer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lebuzzer -d lebuzzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
