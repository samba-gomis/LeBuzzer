name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push on the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The Spring context needs a database to start (the tests load it).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lebuzzer
          POSTGRES_USER: lebuzzer
          POSTGRES_PASSWORD: lebuzzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lebuzzer -d lebuzzer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
