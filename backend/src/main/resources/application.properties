spring.application.name=backend
server.port=8080

# PostgreSQL (local install, or `docker compose up -d` at the repository root).
# Spring Boot lets any of these values be overridden by an environment
# variable with the matching name, e.g. SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/lebuzzer
spring.datasource.username=lebuzzer
spring.datasource.password=lebuzzer

# The schema is owned by SQL scripts, not generated by Hibernate:
# at startup, Hibernate only checks that the entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from the web layer: data is fully loaded inside the service.
spring.jpa.open-in-view=false
