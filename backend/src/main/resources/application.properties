spring.application.name=backend
server.port=8080

# PostgreSQL (local: `docker compose up -d` at the repository root).
# Each value can be overridden by an environment variable (e.g. in CI).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lebuzzer}
spring.datasource.username=${DB_USERNAME:lebuzzer}
spring.datasource.password=${DB_PASSWORD:lebuzzer}

# The schema is owned by SQL scripts, not generated by Hibernate:
# at startup, Hibernate only checks that the entities match the tables.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from the web layer: data is fully loaded inside the service.
spring.jpa.open-in-view=false
