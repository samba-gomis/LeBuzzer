spring.application.name=backend
server.port=8080

# PostgreSQL (local install, or `docker compose up -d` at the repository root).
# Spring Boot lets any of these values be overridden by an environment
# variable with the matching name, e.g. SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/lebuzzer
spring.datasource.username=lebuzzer
spring.datasource.password=lebuzzer

# The question catalogue lives in schema.sql and data.sql, replayed at every start:
# git is the only source of truth, a change made by hand in the database is lost.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# The schema is owned by these SQL scripts, not generated by Hibernate:
# at startup, Hibernate only checks that the entities match the tables they create.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from the web layer: data is fully loaded inside the service.
spring.jpa.open-in-view=false
